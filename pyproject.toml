[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubingline-paracohesion"
version = "0.1.0"
description = "对每个片段计算首尾衔接度，标出依赖前文才能理解的片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ubingline" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://ubingline.github.io"
Repository = "https://github.com/ubingline/paracohesion"
Issues = "https://github.com/ubingline/paracohesion/issues"

[project.scripts]
paracohesion = "paracohesion:main"

[tool.setuptools]
py-modules = ["paracohesion"]
